name: DiamondLauncher Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamondlauncher-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  build-android-apk:
    name: Build Android APK (Horizon + BoardBridge)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK and matching NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare optional Minecraft 26.3 metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/minecraft/26.3/jars app/src/main/assets
          manifest_url="https://piston-meta.mojang.com/v1/packages/11f1aefe473eefba0af62e3286c33b692807b2eb/26.3.json"
          curl -fsSL "$manifest_url" -o .local/minecraft/26.3/manifest.json
          client_url="$(python3 -c 'import json; print(json.load(open(".local/minecraft/26.3/manifest.json"))["downloads"]["client"]["url"])')"
          server_url="$(python3 -c 'import json; print(json.load(open(".local/minecraft/26.3/manifest.json"))["downloads"]["server"]["url"])')"
          mkdir -p /tmp/mc_install/versions/26.3
          cp .local/minecraft/26.3/manifest.json /tmp/mc_install/versions/26.3/26.3.json
          curl -fsSL "$client_url" -o /tmp/mc_install/versions/26.3/26.3.jar
          curl -fsSL "$server_url" -o /tmp/server-26.3.jar
          python3 tools/lab.py prepare --minecraft-dir /tmp/mc_install --server-jar /tmp/server-26.3.jar || true
          cargo run --release -p horizon-prepare -- --prepare --minecraft-dir /tmp/mc_install --server-jar /tmp/server-26.3.jar || true
          if [ -d .local/horizon-client/26.3 ]; then
            (cd .local/horizon-client/26.3 && zip -r -q "$GITHUB_WORKSPACE/app/src/main/assets/horizon-26.3-metadata.zip" \
              *.json *.nbt worldgen/ -x 'assets/*' 'data/*' || true)
          fi

      - name: Build Horizon client for Android ARM64
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a build --release -p horizon-client --no-default-features --locked
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/horizon-client app/src/main/jniLibs/arm64-v8a/libhorizon_client.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libhorizon_client.so

      - name: Build debug and release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiamondLauncher-Android-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14